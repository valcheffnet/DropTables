name: Share my drop tables
description: Paste the text from /dt export so your drop counts end up in the shared database.
title: "Drop tables"
labels: ["share"]
body:
  - type: markdown
    attributes:
      value: |
        In game, type `/dt export` (or right-click the minimap button and pick Share my tables), press Select and then Ctrl+C in the window, and paste the text below.
        The text holds mob and item ids, kill and drop counts, levels, zones and kill spots, plus a random id of your addon install. No character or account names.
        Everything shared here is published for everyone to use.
  - type: textarea
    id: export
    attributes:
      label: Export text
      description: Starts with DT1:. If the window shows several parts, open one form per part.
      render: text
    validations:
      required: true
