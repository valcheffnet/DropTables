name: Merge shared counts

# Every run takes all open issues labelled share or relay, so when GitHub drops a run from the queue nothing is lost
# and the next run picks those issues up. The hourly run takes in the issues that wait for the next day's limit, more
# than a run's 100, and any left open by a failed run. Only the Python scripts read the issue text, and only from JSON
# files.
on:
  issues:
    types: [opened, labeled]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: An issue to take in even without the share label (number); empty only rebuilds
        required: false
      allow_shrink:
        description: Let the database shrink below 98% of what it was (a source taken out on purpose)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["tools/build_data.py", "tools/check_export.py", "tools/ingest_issue.py", "data/loot-resets.json"]

concurrency:
  group: shared-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  merge:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'share') || contains(github.event.issue.labels.*.name, 'relay')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the issues
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          fields=number,body,author,labels,createdAt
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label share --limit 100 --json "$fields" > "$RUNNER_TEMP/share.json"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label relay --limit 100 --json "$fields" > "$RUNNER_TEMP/relay.json"
          echo "[]" > "$RUNNER_TEMP/extra.json"
          if [ -n "${ISSUE:-}" ]; then
            if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then echo "The issue must be a number."; exit 1; fi
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json "$fields" | jq -s . > "$RUNNER_TEMP/extra.json"
          fi
          jq -s '(.[0] + .[1] | map(select(.labels | map(.name) | index("rejected") | not))) + .[2] | unique_by(.number)' \
            "$RUNNER_TEMP/share.json" "$RUNNER_TEMP/relay.json" "$RUNNER_TEMP/extra.json" > "$RUNNER_TEMP/issues.json"
          echo "$(jq length "$RUNNER_TEMP/issues.json") issues to take in"

      - name: Take in the exports
        run: python tools/ingest_issue.py "$RUNNER_TEMP/issues.json" --replies "$RUNNER_TEMP/replies"

      - name: Build the shared database
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          set -euo pipefail
          if [ "${ALLOW_SHRINK:-}" = "true" ]; then
            python tools/build_data.py --allow-shrink
          else
            python tools/build_data.py
          fi

      - name: Back up the data folder
        # To R2, as it was before this build (tools/backup_data.py). Without the R2 secrets it only warns.
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python tools/backup_data.py

      - name: Commit
        run: |
          set -euo pipefail
          git add -A data DropTables/Data.lua
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -F "$RUNNER_TEMP/replies/message.txt"
          git push || { git pull --rebase -q && git push; }

      - name: Answer the issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create rejected --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Export text that could not be taken in" --force
          gh label create waiting --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "Over the daily limit, goes in on the next day" --force
          while read -r number outcome; do
            if [ "$outcome" = "still-waiting" ]; then
              continue
            fi
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/replies/$number.md"
            case "$outcome" in
              waiting)
                gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label waiting ;;
              rejected)
                gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label rejected
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason "not planned" ;;
              *)
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed ;;
            esac
          done < "$RUNNER_TEMP/replies/outcomes.txt"
